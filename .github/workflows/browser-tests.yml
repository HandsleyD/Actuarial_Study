name: Browser tests

# Drives the real site in Chromium with Playwright: every page and feature,
# at a fixed date, with no network beyond a local server. See
# tests/e2e/README.md. Runs on any change to the site, the tests or their
# tooling.

on:
  push:
    paths:
      - "docs/**"
      - "maths-study/exams/*/progress.md"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-tests.yml"
  pull_request:
    paths:
      - "docs/**"
      - "maths-study/exams/*/progress.md"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-tests.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
