name: Validate study content

# Catches the class of bug that has shipped to main before: broken LaTeX
# escaping in flashcard/question text (a raw backslash silently dropped, or
# turned into a real JS escape like \t, corrupting the visible text),
# missing "explain" fields, question marks not summing to their declared
# total, and progress.md module rows drifting out of sync with
# docs/data.js. See scripts/validate-content.mjs for what's actually
# checked. drills.js and diagrams.js are on the list too: the validator also
# checks drill item shapes and that every hotspot answer names a region its
# diagram actually has, and a content-only change to either file would
# otherwise skip CI entirely.

on:
  push:
    paths:
      - "docs/data.js"
      - "docs/questions.js"
      - "docs/drills.js"
      - "docs/diagrams.js"
      - "maths-study/exams/*/progress.md"
      - "scripts/validate-content.mjs"
      - "docs/srs.js"
      - "scripts/test-srs.mjs"
      - "docs/exam-stats.js"
      - "scripts/extract-exam-stats.mjs"
      - "maths-study/resources/past-papers/processed/**/*examiner-report*"
  pull_request:
    paths:
      - "docs/data.js"
      - "docs/questions.js"
      - "docs/drills.js"
      - "docs/diagrams.js"
      - "maths-study/exams/*/progress.md"
      - "scripts/validate-content.mjs"
      - "docs/srs.js"
      - "scripts/test-srs.mjs"
      - "docs/exam-stats.js"
      - "scripts/extract-exam-stats.mjs"
      - "maths-study/resources/past-papers/processed/**/*examiner-report*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Spaced-repetition scheduling tests
        run: node scripts/test-srs.mjs

      - name: Pass-rate data matches the examiners' reports
        run: node scripts/extract-exam-stats.mjs --check
