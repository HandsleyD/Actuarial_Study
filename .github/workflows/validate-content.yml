name: Validate study content

# Catches the class of bug that has shipped to main before: broken LaTeX
# escaping in flashcard/question text (a raw backslash silently dropped, or
# turned into a real JS escape like \t, corrupting the visible text),
# missing "explain" fields, question marks not summing to their declared
# total, progress.md module rows drifting out of sync with the subject's
# content file, and docs/catalog.js not rebuilt after a content edit. See
# scripts/validate-content.mjs for what's actually checked, and
# docs/content/README.md for the layout. diagrams.js is on the list too: the
# validator checks that every hotspot answer names a region its diagram
# actually has, and a diagram-only change would otherwise skip CI entirely.

on:
  push:
    paths:
      - "docs/data.js"
      - "docs/content/**"
      - "docs/catalog.js"
      - "docs/index.html"
      - "docs/questions.js"
      - "docs/drills.js"
      - "docs/calc-drills.js"
      - "scripts/test-calc-drills.mjs"
      - "docs/diagrams.js"
      - "maths-study/exams/*/progress.md"
      - "scripts/validate-content.mjs"
      - "scripts/build-catalog.mjs"
      - "scripts/content-lib.mjs"
      - "docs/srs.js"
      - "scripts/test-srs.mjs"
      - "docs/store.js"
      - "scripts/test-plan-sync.mjs"
      - "scripts/test-progress-sync.mjs"
      - "docs/route.js"
      - "docs/exam-dates.js"
      - "scripts/test-route.mjs"
      - "docs/readiness.js"
      - "scripts/test-readiness.mjs"
      - "docs/exam-stats.js"
      - "scripts/extract-exam-stats.mjs"
      - "maths-study/resources/past-papers/processed/**/*examiner-report*"
  # Every PR, with no path filter, so the check always reports: it's a
  # required status check on main, and a required check that never runs
  # leaves the PR waiting forever.
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Content catalog is up to date
        run: node scripts/build-catalog.mjs --check
      - name: Calculation drills match independent calculations
        run: node scripts/test-calc-drills.mjs

      - name: Spaced-repetition scheduling tests
        run: node scripts/test-srs.mjs

      - name: Exam plan sync tests
        run: node scripts/test-plan-sync.mjs

      - name: Progress sync tests
        run: node scripts/test-progress-sync.mjs

      - name: Route to Associate and Fellow tests
        run: node scripts/test-route.mjs

      - name: Readiness and daily pace tests
        run: node scripts/test-readiness.mjs

      - name: Pass-rate data matches the examiners' reports
        run: node scripts/extract-exam-stats.mjs --check
