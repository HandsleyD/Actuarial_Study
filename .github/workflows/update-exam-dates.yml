name: Update IFoA exam dates

# Weekly: re-reads https://actuaries.org.uk/qualify/my-exams/key-dates/ with
# scripts/update-exam-dates.mjs and, if the timetable, booking dates or
# results dates have changed, opens (or refreshes) a PR updating
# docs/exam-dates.js for the Exam Hub page. Nothing reaches main without the
# PR being merged by hand.
#
# If the IFoA redesigns the page the script exits non-zero instead of writing
# a half-empty file, so the run fails and GitHub emails the repo owner.
#
# The branch and PR are made as the repo's own GitHub App (Fellow bot: see
# .github/BOT.md), not with GITHUB_TOKEN. PRs opened with GITHUB_TOKEN don't
# trigger other workflows, so the required validate and e2e checks would
# never run and the PR could never be merged; the app's PRs trigger them
# like anyone else's.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

# Writes go through the Fellow bot's token, so the built-in one only reads.
permissions:
  contents: read

concurrency:
  group: update-exam-dates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/update-exam-dates
    steps:
      - name: Get a token for the Fellow bot
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FELLOW_BOT_APP_ID }}
          private-key: ${{ secrets.FELLOW_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.bot.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Read the IFoA exam dates page
        run: node scripts/update-exam-dates.mjs

      - name: Open or refresh a PR if the dates changed
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}[bot]
        run: |
          if git diff --quiet -- docs/exam-dates.js; then
            echo "Exam dates unchanged."
            exit 0
          fi
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/exam-dates.js
          git commit -m "Update IFoA exam dates from actuaries.org.uk"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Update IFoA exam dates" \
              --body "The IFoA's [key exam dates page](https://actuaries.org.uk/qualify/my-exams/key-dates/) has changed. This updates \`docs/exam-dates.js\`, which feeds the Exam Hub page. Check the diff against the IFoA page, then merge.

          Opened automatically by the weekly \`update-exam-dates\` workflow."
          else
            echo "Existing PR refreshed."
          fi
